# Workflow: AI PR Description + AI Code Review
#
# При создании нового PR выполняет два анализа на основе git diff:
#
#   1. AI PR Description — генерирует текстовое описание изменений
#   2. AI Code Review    — проверяет код на типовые ошибки маркетплейса
#
# Каждый результат публикуется отдельным комментарием к PR.
#
# Требуется секрет репозитория: OPENAI_API_KEY
#
# Шаги:
#   1. actions/checkout@v4               — клонирование
#   2. shell (bash)                      — получение git diff (base64)
#   3. python3 script                    — генерация описания через OpenRouter API
#   4. actions/github-script@v7          — комментарий с описанием
#   5. python3 script                    — code review через OpenAI API
#   6. actions/github-script@v7          — комментарий с ревью

name: AI PR Description & Code Review

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    name: AI Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get git diff (base64)
        run: |
          BYTES=$(git diff origin/${{ github.base_ref }}...HEAD -- . | wc -c)
          if [ "$BYTES" -gt 15000 ]; then
            echo "::warning::Дифф >15 КБ, обрезан до 15000 байт (факт: $BYTES байт)"
          fi
          git diff origin/${{ github.base_ref }}...HEAD -- . \
            | head -c 15000 \
            | base64 -w 0 > /tmp/git_diff.b64

      - name: Generate PR description via OpenRouter
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 .github/scripts/generate_pr_description.py

      - name: Post PR description comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const desc = fs.readFileSync('/tmp/pr_description.txt', 'utf-8');
            const body = `## 📋 AI-описание изменений\n\n${desc}\n\n---\n*Сгенерировано на основе git diff*`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

      - name: Run AI Code Review via OpenRouter
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 .github/scripts/run_code_review.py

      - name: Post AI Code Review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/pr_review.txt', 'utf-8');
            const body = `## 🔍 AI Code Review\n\n${review}\n\n---\n*Проверка на типовые ошибки маркетплейса. Модель: gpt-4o-mini*`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
