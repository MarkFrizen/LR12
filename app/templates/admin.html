{% extends "base.html" %}
{% block title %}Админ-панель{% endblock %}
{% block content %}
<section class="page-section">
    <h1>Админ-панель</h1>
    <h2>Пользователи</h2>
    <div id="usersList" class="data-list"><p>Загрузка...</p></div>
</section>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login'; return; }

    async function loadUsers() {
        try {
            const res = await fetch('/api/v1/auth/users', {
                headers: {'Authorization': `Bearer ${token}`}
            });
            if (!res.ok) throw new Error('Forbidden');
            const users = await res.json();
            const list = document.getElementById('usersList');
            list.innerHTML = `<table><thead><tr>
                <th>ID</th><th>Имя</th><th>Email</th><th>Роль</th><th>Активен</th><th>Действия</th>
            </tr></thead><tbody>
                ${users.map(u => `<tr>
                    <td>${u.id}</td>
                    <td>${u.username}</td>
                    <td>${u.email}</td>
                    <td>
                        <select class="role-select" data-user-id="${u.id}">
                            <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
                            <option value="moderator" ${u.role==='moderator'?'selected':''}>Moderator</option>
                            <option value="seller" ${u.role==='seller'?'selected':''}>Seller</option>
                            <option value="buyer" ${u.role==='buyer'?'selected':''}>Buyer</option>
                            <option value="courier" ${u.role==='courier'?'selected':''}>Courier</option>
                            <option value="carrier" ${u.role==='carrier'?'selected':''}>Carrier</option>
                        </select>
                    </td>
                    <td>${u.is_active ? '✅' : '❌'}</td>
                    <td>
                        <button class="btn-sm" onclick="toggleUser(${u.id})">${u.is_active ? 'Блокировать' : 'Разблокировать'}</button>
                    </td>
                </tr>`).join('')}
            </tbody></table>`;

            document.querySelectorAll('.role-select').forEach(sel => {
                sel.addEventListener('change', async () => {
                    await fetch(`/api/v1/auth/users/${sel.dataset.userId}/role?new_role=${sel.value}`, {
                        method: 'PATCH',
                        headers: {'Authorization': `Bearer ${token}`}
                    });
                    alert('Роль изменена!');
                });
            });
        } catch {
            document.getElementById('usersList').innerHTML = '<p class="error">Нет доступа</p>';
        }
    }

    window.toggleUser = async (userId) => {
        await fetch(`/api/v1/auth/users/${userId}/toggle`, {
            method: 'POST',
            headers: {'Authorization': `Bearer ${token}`}
        });
        loadUsers();
    };

    loadUsers();
});
</script>
{% endblock %}
