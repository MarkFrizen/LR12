{% extends "base.html" %}
{% block title %}Товары{% endblock %}
{% block content %}
<section class="page-section">
    <h1>Каталог товаров</h1>

    <div id="productFormContainer" style="display:none;" class="card" style="margin-bottom:1rem;">
        <h3 id="productFormTitle">Добавить товар</h3>
        <form id="productForm" onsubmit="return saveProduct(event)">
            <input type="hidden" id="editProductId" value="">
            <div class="form-group"><label>Название</label><input type="text" id="productName" required></div>
            <div class="form-group"><label>Цена</label><input type="number" id="productPrice" required min="0.01" step="0.01"></div>
            <div class="form-group"><label>Остаток</label><input type="number" id="productStock" value="0" min="0"></div>
            <div class="form-group"><label>Категория</label><input type="text" id="productCategory"></div>
            <div class="form-group"><label>Описание</label><textarea id="productDescription" rows="3"></textarea></div>
            <div class="form-group"><label>ID продавца</label><input type="number" id="productSellerId" required min="1"></div>
            <button type="submit" class="btn btn-primary" id="productFormBtn">Сохранить</button>
            <button type="button" class="btn btn-secondary" onclick="cancelProductForm()">Отмена</button>
        </form>
    </div>

    <button class="btn btn-primary" id="addProductBtn" style="margin-bottom:1rem;display:none;" onclick="showProductForm()">+ Добавить товар</button>

    <div class="filters">
        <input type="text" id="filterCategory" placeholder="Категория">
        <button class="btn btn-primary" onclick="loadProducts()">Поиск</button>
    </div>
    <div id="productsList" class="data-list"><p>Загрузка...</p></div>
</section>
{% endblock %}
{% block scripts %}
<script>
let currentUser = null;

document.addEventListener('DOMContentLoaded', async () => {
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login'; return; }
    try {
        const res = await fetch('/api/v1/auth/me', { headers: {'Authorization': `Bearer ${token}`} });
        if (!res.ok) throw new Error('Unauthorized');
        currentUser = await res.json();
        if (currentUser.role === 'admin' || currentUser.role === 'moderator' || currentUser.role === 'seller') {
            document.getElementById('addProductBtn').style.display = 'inline-block';
        }
        await loadProducts();
    } catch { localStorage.removeItem('token'); window.location.href = '/login'; }
});

async function loadProducts() {
    const token = localStorage.getItem('token');
    const category = document.getElementById('filterCategory').value;
    let url = '/api/v1/products/?limit=50';
    if (category) url += `&category=${encodeURIComponent(category)}`;
    try {
        const headers = {};
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const res = await fetch(url, {headers});
        const products = await res.json();
        const list = document.getElementById('productsList');
        if (products.length === 0) {
            list.innerHTML = '<p class="empty">Товары не найдены.</p>';
            return;
        }
        const canEdit = currentUser && (currentUser.role === 'admin' || currentUser.role === 'moderator' || currentUser.role === 'seller');
        const canDelete = currentUser && currentUser.role === 'admin';
        list.innerHTML = `<table><thead><tr>
            <th>ID</th><th>Название</th><th>Цена</th><th>Категория</th><th>Остаток</th><th>Продавец</th>
            ${(canEdit || canDelete) ? '<th>Действия</th>' : ''}
        </tr></thead><tbody>
            ${products.map(p => `<tr>
                <td>${p.id}</td>
                <td>${p.name}</td>
                <td>${p.price} ₽</td>
                <td>${p.category || '—'}</td>
                <td>${p.stock}</td>
                <td>${p.seller_id}</td>
                ${(canEdit || canDelete) ? `<td>
                    ${canEdit ? `<button class="btn-sm" onclick="editProduct(${p.id}, '${p.name.replace(/'/g, "\\'")}', ${p.price}, ${p.stock}, '${(p.category||'').replace(/'/g, "\\'")}', '${(p.description||'').replace(/'/g, "\\'")}', ${p.seller_id})">✏️</button>` : ''}
                    ${canDelete ? `<button class="btn-sm" onclick="deleteProduct(${p.id})">🗑️</button>` : ''}
                </td>` : ''}
            </tr>`).join('')}
        </tbody></table>`;
    } catch { document.getElementById('productsList').innerHTML = '<p class="error">Ошибка загрузки</p>'; }
}

function showProductForm(data) {
    document.getElementById('productFormContainer').style.display = 'block';
    document.getElementById('addProductBtn').style.display = 'none';
    if (data) {
        document.getElementById('productFormTitle').textContent = 'Редактировать товар';
        document.getElementById('editProductId').value = data.id;
        document.getElementById('productName').value = data.name;
        document.getElementById('productPrice').value = data.price;
        document.getElementById('productStock').value = data.stock;
        document.getElementById('productCategory').value = data.category;
        document.getElementById('productDescription').value = data.description;
        document.getElementById('productSellerId').value = data.sellerId;
        document.getElementById('productFormBtn').textContent = 'Обновить';
    }
}

function cancelProductForm() {
    document.getElementById('productFormContainer').style.display = 'none';
    document.getElementById('addProductBtn').style.display = 'inline-block';
    document.getElementById('productForm').reset();
    document.getElementById('editProductId').value = '';
    document.getElementById('productFormTitle').textContent = 'Добавить товар';
    document.getElementById('productFormBtn').textContent = 'Сохранить';
}

async function saveProduct(e) {
    e.preventDefault();
    const token = localStorage.getItem('token');
    const id = document.getElementById('editProductId').value;
    const data = {
        name: document.getElementById('productName').value,
        price: parseFloat(document.getElementById('productPrice').value),
        stock: parseInt(document.getElementById('productStock').value) || 0,
        category: document.getElementById('productCategory').value || null,
        description: document.getElementById('productDescription').value || null,
        seller_id: parseInt(document.getElementById('productSellerId').value),
    };
    try {
        const url = id ? `/api/v1/products/${id}` : '/api/v1/products/';
        const method = id ? 'PATCH' : 'POST';
        const res = await fetch(url, {
            method, headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'},
            body: JSON.stringify(data),
        });
        if (!res.ok) { const err = await res.json(); alert(err.detail || 'Ошибка'); return; }
        cancelProductForm();
        await loadProducts();
    } catch { alert('Ошибка сохранения'); }
}

async function deleteProduct(id) {
    if (!confirm('Удалить товар?')) return;
    const token = localStorage.getItem('token');
    try {
        const res = await fetch(`/api/v1/products/${id}`, { method: 'DELETE', headers: {'Authorization': `Bearer ${token}`} });
        if (!res.ok) { const err = await res.json(); alert(err.detail || 'Ошибка'); return; }
        await loadProducts();
    } catch { alert('Ошибка удаления'); }
}
</script>
{% endblock %}
