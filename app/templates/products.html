{% extends "base.html" %}
{% block title %}Товары{% endblock %}
{% block content %}
<section class="page-section">
    <h1>Каталог товаров</h1>
    <div class="filters">
        <input type="text" id="filterCategory" placeholder="Категория">
        <button class="btn btn-primary" onclick="loadProducts()">Поиск</button>
    </div>
    <div id="productsList" class="data-list"><p>Загрузка...</p></div>
</section>
{% endblock %}
{% block scripts %}
<script>
async function loadProducts() {
    const token = localStorage.getItem('token');
    const category = document.getElementById('filterCategory').value;
    let url = '/api/v1/products/?limit=50';
    if (category) url += `&category=${encodeURIComponent(category)}`;
    try {
        const headers = {};
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const res = await fetch(url, {headers});
        const products = await res.json();
        const list = document.getElementById('productsList');
        if (products.length === 0) {
            list.innerHTML = '<p class="empty">Товары не найдены.</p>';
            return;
        }
        list.innerHTML = `<table><thead><tr>
            <th>ID</th><th>Название</th><th>Цена</th><th>Категория</th><th>Остаток</th><th>Продавец</th>
        </tr></thead><tbody>
            ${products.map(p => `<tr>
                <td>${p.id}</td>
                <td>${p.name}</td>
                <td>${p.price} ₽</td>
                <td>${p.category || '—'}</td>
                <td>${p.stock}</td>
                <td>${p.seller_id}</td>
            </tr>`).join('')}
        </tbody></table>`;
    } catch { document.getElementById('productsList').innerHTML = '<p class="error">Ошибка загрузки</p>'; }
}
document.addEventListener('DOMContentLoaded', loadProducts);
</script>
{% endblock %}
