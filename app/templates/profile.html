{% extends "base.html" %}
{% block title %}Профиль{% endblock %}
{% block content %}
<section class="page-section">
    <h1>Профиль пользователя</h1>
    <div id="profileInfo" class="card"><p>Загрузка...</p></div>
    <form id="profileForm" class="auth-form" style="display:none;">
        <div class="form-group">
            <label for="full_name">Полное имя</label>
            <input type="text" id="full_name" name="full_name">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
        </div>
        <div class="form-group">
            <label for="phone">Телефон</label>
            <input type="text" id="phone" name="phone">
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>

    <hr style="margin: 2rem 0; border-color: var(--border);">

    <h2>Смена пароля</h2>
    <form id="passwordForm" class="auth-form" style="display:none;">
        <div class="form-group">
            <label for="old_password">Текущий пароль</label>
            <input type="password" id="old_password" name="old_password" required>
        </div>
        <div class="form-group">
            <label for="new_password">Новый пароль</label>
            <input type="password" id="new_password" name="new_password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary">Сменить пароль</button>
    </form>
    <div id="passwordError" class="error-message" style="display:none;"></div>
    <div id="passwordSuccess" class="error-message" style="display:none; background: #d1fae5; border-color: #6ee7b7; color: #065f46;"></div>
</section>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login'; return; }
    try {
        const res = await fetch('/api/v1/auth/me', {
            headers: {'Authorization': `Bearer ${token}`}
        });
        const user = await res.json();
        document.getElementById('profileInfo').innerHTML = `
            <p><strong>Имя:</strong> ${user.full_name || '—'}</p>
            <p><strong>Email:</strong> ${user.email}</p>
            <p><strong>Телефон:</strong> ${user.phone || '—'}</p>
            <p><strong>Роль:</strong> ${user.role}</p>
        `;
        const form = document.getElementById('profileForm');
        form.style.display = 'block';
        document.getElementById('full_name').value = user.full_name || '';
        document.getElementById('email').value = user.email;
        document.getElementById('phone').value = user.phone || '';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                full_name: document.getElementById('full_name').value || null,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value || null
            };
            try {
                const r = await fetch('/api/v1/auth/me', {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
                    body: JSON.stringify(data)
                });
                if (!r.ok) throw new Error((await r.json()).detail);
                alert('Профиль обновлён!');
                window.location.reload();
            } catch (err) {
                document.getElementById('profileError').textContent = err.message;
            }
        });

        // Смена пароля
        const pwdForm = document.getElementById('passwordForm');
        pwdForm.style.display = 'block';
        pwdForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pwdError = document.getElementById('passwordError');
            const pwdSuccess = document.getElementById('passwordSuccess');
            pwdError.style.display = 'none';
            pwdSuccess.style.display = 'none';
            try {
                const r = await fetch('/api/v1/auth/change-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
                    body: JSON.stringify({
                        old_password: document.getElementById('old_password').value,
                        new_password: document.getElementById('new_password').value,
                    }),
                });
                if (!r.ok) {
                    const err = await r.json();
                    throw new Error(err.detail || 'Ошибка смены пароля');
                }
                pwdSuccess.textContent = 'Пароль успешно изменён!';
                pwdSuccess.style.display = 'block';
                document.getElementById('old_password').value = '';
                document.getElementById('new_password').value = '';
            } catch (err) {
                pwdError.textContent = err.message;
                pwdError.style.display = 'block';
            }
        });
    } catch { window.location.href = '/login'; }
});
</script>
{% endblock %}
